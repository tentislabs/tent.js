name: runs

# The run on GitHub: the test files of tests/systems.txt on macOS, whose point is a difference between systems, on
# every pull request and every push to main. Every other test runs on the owner's computer, on Windows and on Linux:
# a run of every test on shared machines gave more faults of the machines than of the code.
# A commit whose message holds [skip ci] anywhere starts none: GitHub itself leaves such a commit out.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request ends the run of the older one. A run on main is in a group of its own, since
# GitHub ends a run that waits when a newer one of its group arrives, also where cancel-in-progress is false:
# https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/control-the-concurrency-of-workflows-and-jobs
concurrency:
  group: runs-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    name: macos
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      # A pull request is checked out as joined to its target, and the result file names the commit of the branch.
      TENT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      # The speed of a shared machine moves with the work of others: a bar is reported here, and held on a computer of its own.
      TENT_BARS: report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: npm ci
        run: npm ci
      - name: The tests of tests/systems.txt
        run: npm test -- --list=tests/systems.txt --all
      - name: Keep the result file
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-macos
          path: results/macos.json
          if-no-files-found: ignore
