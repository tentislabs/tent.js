name: runs

# The automatic runs: every pull request and every push to main, on the three systems.
# A commit whose message holds [skip ci] anywhere starts none: GitHub itself leaves such a commit out.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request ends the run of the older one. A run on main is in a group of its own, since
# GitHub ends a run that waits when a newer one of its group arrives, also where cancel-in-progress is false:
# https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/control-the-concurrency-of-workflows-and-jobs
concurrency:
  group: runs-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run:
    name: ${{ matrix.system }} ${{ matrix.shard }}/4
    strategy:
      # Each system runs to its end when another fails.
      fail-fast: false
      # The tests of each system are shared out over four machines side by side: a whole run on one free runner
      # takes most of an hour, and longer than that on macOS.
      matrix:
        system: [linux, windows, macos]
        shard: [1, 2, 3, 4]
        include:
          - system: linux
            os: ubuntu-latest
          - system: windows
            os: windows-latest
          - system: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      # A pull request is checked out as joined to its target, and the result file names the commit of the branch.
      TENT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: npm ci
        run: npm ci
      # The browsers of the tests, as the pinned playwright-core names them, with what Linux needs to run them.
      - name: The browsers of the tests
        run: npx playwright-core install ${{ matrix.system == 'linux' && '--with-deps' || '' }} chromium firefox webkit
      # The checks of the whole tree run once for each system, on its first machine.
      # A run on main fails where a joined list differs from the one it makes. A pull request goes on with its own.
      - name: node scripts/lists.mjs
        if: matrix.shard == 1
        run: npm run lists -- ${{ github.event_name == 'push' && '--main' || '' }}
      - name: The formatter, the linter and scripts/comments.mjs
        if: matrix.shard == 1
        run: npm run lint
      - name: The type check
        if: matrix.shard == 1
        run: npm run types
      - name: The search for what nothing uses
        if: matrix.shard == 1
        run: node scripts/search.mjs
      - name: The tests
        run: npm test -- --shard=${{ matrix.shard }}/4
      - name: Keep the result file and the new pictures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-${{ matrix.system }}-${{ matrix.shard }}
          path: |
            results/${{ matrix.system }}.json
            **/*.new.png
            !node_modules/**
          if-no-files-found: ignore
