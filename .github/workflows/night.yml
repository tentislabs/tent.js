name: night

# The heavy tests, whose name holds [night]: each night on main, on the three systems.
# It can also be started by hand, with gh workflow run night.yml.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  night:
    name: ${{ matrix.system }} ${{ matrix.shard }}/4
    strategy:
      fail-fast: false
      # The heavy tests of each system are shared out over four machines side by side: on one free runner they take
      # longer than the hours a job is given.
      matrix:
        system: [linux, windows, macos]
        shard: [1, 2, 3, 4]
        include:
          - system: linux
            os: ubuntu-latest
          - system: windows
            os: windows-latest
          - system: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      TENT_COMMIT: ${{ github.sha }}
      # The speed of a shared machine moves with the work of others: a bar is reported here, and held on a computer of its own.
      TENT_BARS: report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: npm ci
        run: npm ci
      - name: The heavy tests
        run: npm run night -- --shard=${{ matrix.shard }}/4
      - name: Keep the result file
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-night-${{ matrix.system }}-${{ matrix.shard }}
          path: results/${{ matrix.system }}.night.json
          if-no-files-found: ignore
