<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>bots</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #121212;
        color: #ffffff94;
        font: 15px system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        display: grid;
        place-items: center;
        gap: 18px;
        height: 100%;
        align-content: center;
      }
      .dots {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .dots i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #f2f2f2;
        opacity: 0.45;
      }
      @media (prefers-reduced-motion: no-preference) {
        .dots i {
          animation: dot 1.2s ease-in-out infinite;
        }
        .dots i:nth-child(2) {
          animation-delay: 0.15s;
        }
        .dots i:nth-child(3) {
          animation-delay: 0.3s;
        }
      }
      @keyframes dot {
        40% {
          opacity: 1;
          transform: scale(1.2);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 100 100" width="72" height="72" aria-hidden="true">
        <circle cx="50" cy="50" r="46" fill="#ffffff" />
        <rect x="35" y="36" width="10" height="22" rx="5" fill="#141414" />
        <rect x="55" y="36" width="10" height="22" rx="5" fill="#141414" />
      </svg>
      <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
      <p id="words">Starting your bots</p>
    </main>
  </body>
</html>
